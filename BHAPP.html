<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Detektor Hati 04</title>
    <style>
        body {
            background-color: #ffe4e1;
            font-family: 'Arial', sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        h1 {
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
            color: #d33682;
        }
        .container_04 {
            max-width: 450px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.5);
            padding: 20px;
            border-radius: 10px;
        }
        .btn_mau_04 {
            background-color: #ffb6c1;
            font-weight: bold;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
        }
        .btn_nggak_04 {
            background-color: #eceff1;
            padding: 10px 20px;
            border: none;
            position: absolute;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
            transition: all 0.1s ease;
        }
        textarea {
            width: 90%;
            height: 150px;
            margin-top: 150px;
            font-size: 14px;
            padding: 10px;
        }
    </style>
</head>
<body>

<div class="container_04">
    <h1>Pertanyaan Penting 04</h1>
    <p><b>Kamu mau gak nemenin aku<br>terus sampai semester akhir?</b></p>
    
    <button class="btn_mau_04" onclick="klikMau04()">Mau BGT! 🥰</button>
    <button class="btn_nggak_04" id="nggakBtn04" onmouseover="hindariMouse04()">Nggak 😜</button>
    
    <br>
    <textarea id="textBucin04" placeholder="Kotak Catatan Tambahan (Bisa kamu ketik sendiri):"></textarea>
</div>

<script>
    function klikMau04() {
        var pesan_04 = "Yeaaay! Keputusan yang sangat tepat! 🥰\n\nSejac ada kamu, grafik kebahagiaanku naik terus.\nPokoknya kamu itu pelengkap paling penting.\n\nTerima kasih sudah selalu ada ya! ✨❤\n";
        document.getElementById("textBucin04").value = pesan_04;
        alert("Pilihanmu dikunci, gabisa diganti ya! 😜");
    }

    function hindariMouse04() {
        var btn_04 = document.getElementById("nggakBtn04");
        // Mengacak posisi tombol di layar HP / Laptop
        var x_04 = Math.random() * (window.innerWidth - 100);
        var y_04 = Math.random() * (window.innerHeight - 100);
        
        // Memastikan tombol tidak terlalu ke atas menutupi teks utama
        if(y_04 < 150) y_04 = 200;

        btn_04.style.left = x_04 + 'px';
        btn_04.style.top = y_04 + 'px';
    }
</script>

</body>
</html>
